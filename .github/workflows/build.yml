name: Build GardenCivics

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GardenCivics
        uses: actions/checkout@v4
        with:
          path: plugin
      - name: Checkout GardenCore
        uses: actions/checkout@v4
        with:
          repository: Heras-Garden/GardenCore
          ref: ${{ github.event_name == 'push' && github.ref_name == 'main' && 'main' || 'feature/claim-model-overhaul' }}
          path: GardenCore
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install GardenCore
        run: mvn -B -f GardenCore/pom.xml install -DskipTests
      - name: Build GardenCivics
        run: mvn -B -f plugin/pom.xml clean package
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: GardenCivics
          path: plugin/target/GardenCivics-*.jar
